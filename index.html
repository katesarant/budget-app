<style>
:root{--bg:#faf8f5;--card:#fff;--tx:#2a2622;--mut:#8a8178;--bd:#e8e2da;--ac:#6d4aff;--ok:#1f9d6b;--bad:#d9455f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17151a;--card:#221f27;--tx:#f0ece6;--mut:#9a9288;--bd:#363140;--ac:#9b83ff;--ok:#43c795;--bad:#ff6b83;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17151a;--card:#221f27;--tx:#f0ece6;--mut:#9a9288;--bd:#363140;--ac:#9b83ff;--ok:#43c795;--bad:#ff6b83;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:560px;padding:12px 14px 40px}
h1{font-size:20px;margin:6px 0 10px}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;cursor:pointer}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;min-width:0}
.bar{display:flex;gap:8px;margin-bottom:10px}.bar select{flex:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:2px 0 6px}
.bn{border-left:4px solid var(--bad)}.bn div{padding:2px 0}
.item{border-bottom:1px solid var(--bd)}.item:last-of-type{border:0}
.row{display:flex;align-items:center;gap:8px;padding:5px 0}.row .n{flex:1;min-width:0;overflow-wrap:anywhere}.row .n.pd{text-decoration:line-through;color:var(--mut)}
.row input.a{width:92px;text-align:right}.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok)}
.h{cursor:grab;touch-action:none;color:var(--mut);padding:4px 6px;user-select:none;font-size:18px}
.drg{opacity:.55;background:var(--bd)}
.sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 0 8px 30px;font-size:13px}.sub .nm{flex:1;min-width:120px}.sub .dd{width:64px}
.add{display:flex;gap:6px;margin-top:8px}.add input{flex:1}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:center}
.sum small{display:block;color:var(--mut);font-size:12px}.sum b{font-size:17px}
.pos{color:var(--ok)}.neg{color:var(--bad)}.st{font-size:12px;color:var(--mut);text-align:center;min-height:16px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}th:first-child,td:first-child{text-align:left}
.ch{display:flex;align-items:flex-end;gap:4px;height:130px}.ch div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mut)}
.ch i{display:block;width:100%;border-radius:4px 4px 0 0;min-height:1px}
.yi{border-bottom:1px solid var(--bd);padding:6px 0;cursor:pointer}.yi .t{display:flex;justify-content:space-between}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;font-size:13px;color:var(--mut);padding-top:6px}.mg b{color:var(--tx)}
.del{background:var(--bad);color:#fff;border-color:var(--bad)}
.sw{display:flex;gap:8px;width:100%}.dot{width:28px;height:28px;padding:0;border-radius:50%;font-size:12px}.row .n{cursor:pointer}
.hide{display:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<body>
<h1 style="display:flex;justify-content:space-between;align-items:center">💶 Τα έξοδά μου<button id="gb">⚙</button></h1>
<div class="card hide" id="gp"><h2>Σύνδεση GitHub (ιδιωτικό repo δεδομένων)</h2>
<input id="g1" placeholder="owner/όνομα-repo" style="width:100%;margin-bottom:6px"><input id="g2" placeholder="branch (main)" style="width:100%;margin-bottom:6px"><input id="g3" placeholder="αρχείο (data.json)" style="width:100%;margin-bottom:6px"><input id="g4" type="password" placeholder="Fine-grained token" style="width:100%;margin-bottom:6px">
<div class="add"><button id="gsv" style="flex:1">Σύνδεση</button><button id="gsy" style="flex:1">↻ Συγχρονισμός</button></div><div class="st" id="gs"></div></div>
<div class="tabs"><button id="t1" class="on">Μήνας</button><button id="t2">Χρονιά</button></div>
<div class="bar"><select id="mon"></select><select id="yr"></select></div>
<div class="sum"><div><small>Έσοδα</small><b id="si"></b></div><div><small>Έξοδα</small><b id="se"></b></div><div><small>Υπόλοιπο</small><b id="sb"></b></div></div>
<div class="st" id="ac" style="margin:-6px 0 8px"></div>
<section id="v1"><div class="card bn hide" id="bn"></div>
<div class="card"><h2>Έσοδα</h2><div id="inc"></div><div class="add"><input id="ni" placeholder="Νέο έσοδο…"><button data-add="i">＋</button></div></div>
<div class="card"><h2>Έξοδα</h2><input id="qs" placeholder="🔍 Αναζήτηση εξόδου…" style="width:100%;margin-bottom:6px"><div id="exp"></div><div class="add"><input id="ne" placeholder="Νέο έξοδο…"><button data-add="e">＋</button></div><div id="hl" class="st"></div><div class="add"><button id="clr" class="del" style="flex:1">🗑 Καθάρισμα όλων των εξόδων του μήνα</button></div></div>
<div class="st" id="st"></div></section>
<section id="v2" class="hide"><div class="add" style="margin:0 0 6px"><button id="xx" style="flex:1">⬇ Excel (χρονιά)</button><button id="xc" style="flex:1">⬇ CSV</button></div><div class="st" id="st2"></div><div class="card"><h2>Υπόλοιπο ανά μήνα</h2><div class="ch" id="ch"></div></div>
<div class="card scroll"><table id="tb"></table></div>
<div class="card"><h2>Ανά έξοδο (πάτα για μήνες)</h2><div id="yl"></div></div></section>
<script>
const DEF=[["i1","Μισθός","i"],["i2","Ενοίκιο","i"],["i3","Άλλα έσοδα (π.χ. δανεικά που επέστρεψαν)","i"],["e1","Εφορία"],["e2","Cosmote"],["e3","Κοτσόβολος"],["e4","Ψυχολόγος"],["e5","Κοινόχρηστα"],["e6","Φάρμακα"],["e7","Δανεικά / ψυχολόγος"],["e8","Εισιτήρια"],["e9","Ψυχίατρος"],["e10","Καλλυντικά"],["e11","Cosmote σπίτι"],["e12","Μνα Ελένης"],["e13","Super"],["e14","Κάρτα virtual (τόκοι)"],["e15","Κάρτα Ethniki duo (ελάχιστη)"],["e16","Διαιτολόγος"],["e17","Spotify"],["e18","Klarna"],["e19","Γυμναστήριο"],["e20","Δάνειο"],["e21","Μηχανάκι"]];
const mkdef=()=>DEF.map(([id,n,t])=>({id,n,t:t||"e",d:null}));
const MN=["Ιανουάριος","Φεβρουάριος","Μάρτιος","Απρίλιος","Μάιος","Ιούνιος","Ιούλιος","Αύγουστος","Σεπτέμβριος","Οκτώβριος","Νοέμβριος","Δεκέμβριος"];
const $=id=>document.getElementById(id);
const now=new Date();let Y=now.getFullYear(),M=now.getMonth(),data={},cfg=mkdef(),ref=null,cref=null,timer=null,ctimer=null;
let OP=null;const A=(m,id)=>(mo(m)["a_"+id]||[]).reduce((q,e)=>q+num(e.v),0);
const shade=(h,k)=>{if(!h||!k)return h;const f=Math.min(.6,k*.15),n=parseInt(h.slice(1),16);return"#"+[16,8,0].map(x=>Math.round(((n>>x)&255)*(1-f)+255*f).toString(16).padStart(2,"0")).join("")};
const col=(m,id)=>{const b=mo(m)["c_"+id];return b?shade(b,cfg.filter(x=>mo(m)["c_"+x.id]===b).findIndex(x=>x.id===id)):""};
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");const match=n=>norm(n).includes(norm($("qs").value));const LV=(t,m)=>cfg.filter(x=>x.t===t&&!mo(m)["x_"+x.id]);const CLR="🗑 Καθάρισμα όλων των εξόδων του μήνα";
const num=v=>{const n=parseFloat(String(v||"").replace(",","."));return isNaN(n)?0:n};
const eur=n=>n.toLocaleString("el-GR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const mo=m=>data[m]||{};const L=t=>cfg.filter(x=>x.t===t);
const tot=(m,t)=>L(t).reduce((s,x)=>s+num(mo(m)[x.id]),0);
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const GHC=()=>ls("ghcfg",null);let db=ls("budDB",{}),sha=null,tm=null,busy=false,again=false;
const stat=t=>{$("st").textContent=t;$("gs").textContent=t};
function api(method,body){const c=GHC();return fetch("https://api.github.com/repos/"+c.repo+"/contents/"+(c.path||"data.json")+(method==="GET"?"?ref="+(c.branch||"main"):""),{method,headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json"},body:body?JSON.stringify(body):undefined})}
async function pull(){const c=GHC();if(!c||!c.repo||!c.token){stat("Τοπική λειτουργία (χωρίς GitHub)");return}
 try{const r=await api("GET");if(r.status===404){sha=null;stat("Δεν βρέθηκε αρχείο — θα δημιουργηθεί στην πρώτη αποθήκευση (αν το repo είναι σωστό)");return}
  if(!r.ok){stat("⚠ GitHub "+r.status+(r.status===401?" — λάθος ή ληγμένο token":""));return}
  const j=await r.json();sha=j.sha;db=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,"")),ch=>ch.charCodeAt(0))));
  try{localStorage.setItem("budDB",JSON.stringify(db))}catch(e){}stat("✓ Συγχρονίστηκε με GitHub")}catch(e){stat("⚠ Δεν έγινε σύνδεση — τοπικά δεδομένα")}}
async function push(){const c=GHC();if(!c||!c.repo||!c.token){stat("✓ Αποθηκεύτηκε μόνο σε αυτή τη συσκευή");return}if(busy){again=true;return}busy=true;
 try{const body={message:"budget "+new Date().toISOString().slice(0,16),content:btoa(unescape(encodeURIComponent(JSON.stringify(db,null,1)))),branch:c.branch||"main"};if(sha)body.sha=sha;
  const r=await api("PUT",body);if(r.ok){sha=(await r.json()).content.sha;stat("✓ Αποθηκεύτηκε στο GitHub")}else stat(r.status===409||r.status===422?"⚠ Το αρχείο άλλαξε αλλού — πάτα ↻ Συγχρονισμός":"⚠ Σφάλμα GitHub "+r.status)}catch(e){stat("⚠ Δεν αποθηκεύτηκε στο GitHub")}
 busy=false;if(again){again=false;push()}}
function persist(){db.config=cfg;db.years=db.years||{};db.years[Y]=data;try{localStorage.setItem("budDB",JSON.stringify(db))}catch(e){}stat("Αποθήκευση…");clearTimeout(tm);tm=setTimeout(push,1500)}
const save=persist,saveCfg=persist;
function apply(){db.years=db.years||{};cfg=db.config||mkdef();data=db.years[Y]||(db.years[Y]={})}
async function loadCfg(){apply();render();await pull();apply();render()}
async function load(){apply();render()}
function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function rows(box,t){
 box.innerHTML="";
 LV(t,M).filter(it=>t!=="e"||match(it.n)).forEach(it=>{
  const w=mk("div","item");w.dataset.id=it.id;{const cc=col(M,it.id);w.style.borderLeft="4px solid "+(cc||"transparent");w.style.background=cc?cc+"2e":""}w.style.paddingLeft="6px";const r=mk("div","row"),h=mk("span","h","⠿");
  h.onpointerdown=e=>drag(e,w,box,t);r.append(h);
  const nm=mk("span","n",it.n+(it.d?" · "+it.d+"η":""));{const ac=A(M,it.id),pl=num(mo(M)[it.id]);if(t==="e"&&ac>0){const sp=mk("small",null," · πραγμ. "+eur(ac));sp.style.color=pl>0&&ac>pl?"var(--bad)":"var(--ok)";nm.append(sp)}}
  if(t==="e"){const c=mk("input");c.type="checkbox";c.checked=!!mo(M)["p_"+it.id];c.title="Πληρώθηκε";
   c.onchange=()=>{(data[M]=data[M]||{})["p_"+it.id]=c.checked?1:"";nm.classList.toggle("pd",c.checked);banner();save()};
   nm.classList.toggle("pd",c.checked);r.append(c)}
  const a=mk("input","a");a.inputMode="decimal";a.placeholder="0";a.value=mo(M)[it.id]||"";
  a.oninput=()=>{(data[M]=data[M]||{})[it.id]=a.value;sums();save()};
  const g=mk("button",null,"⋯");const s=mk("div","sub hide");if(OP===it.id)s.classList.remove("hide");
  g.onclick=()=>{s.classList.toggle("hide");OP=s.classList.contains("hide")?null:it.id};
  r.append(nm,a,g);
  const rn=mk("input","nm");rn.value=it.n;rn.onchange=()=>{it.n=rn.value.trim()||it.n;saveCfg();render()};s.append(rn);
  if(t==="e"){const d=mk("input","dd");d.type="number";d.min=1;d.max=31;d.placeholder="μέρα";d.value=it.d||"";d.title="Ημέρα πληρωμής κάθε μήνα";
   d.onchange=()=>{it.d=d.value?Math.min(31,Math.max(1,+d.value)):null;saveCfg();render()};s.append(mk("span",null,"Πληρωμή:"),d)}
  nm.onclick=()=>{s.classList.toggle("hide");OP=s.classList.contains("hide")?null:it.id};
  const sw=mk("div","sw");["","#ef4444","#f59e0b","#22c55e","#06b6d4","#6366f1","#d946ef","#78716c"].forEach(c=>{const b=mk("button","dot");b.style.background=c||"transparent";b.title=c?"Χρώμα":"Χωρίς χρώμα";if(!c)b.textContent="∅";b.onclick=()=>{(data[M]=data[M]||{})["c_"+it.id]=c;save();render()};sw.append(b)});s.append(sw);
  if(t==="e"){const pb=mk("button",null,"✔ Το πλήρωσα");pb.onclick=()=>{const k="p_"+it.id;(data[M]=data[M]||{})[k]=mo(M)[k]?"":1;save();render()};s.append(pb)}
  const cp=all=>{const v=mo(M)[it.id];if(!v){$("st").textContent="Γράψε πρώτα ποσό";return}if(M>=11){$("st").textContent="Ο Δεκέμβριος δεν έχει επόμενο μήνα στη χρονιά";return}for(let m=M+1;m<=(all?11:M+1);m++){(data[m]=data[m]||{})[it.id]=v;data[m]["c_"+it.id]=mo(M)["c_"+it.id]||""}save();render()};
  const b1=mk("button",null,"➡ Στον επόμενο μήνα"),b2=mk("button",null,"⏩ Σε όλους τους επόμενους");b1.onclick=()=>cp(false);b2.onclick=()=>cp(true);s.append(mk("span",null,"Ποσό (αλλιώς μόνο εδώ):"),b1,b2);
  if(t==="e"){const ab=mk("div","sw");ab.style.flexWrap="wrap";ab.style.alignItems="center";const ai=mk("input");ai.style.width="90px";ai.inputMode="decimal";ai.placeholder="€ ποσό";const ad=mk("button",null,"＋ Αγορά");
   ad.onclick=()=>{const v=num(ai.value);if(!v)return;const d=data[M]=data[M]||{};(d["a_"+it.id]=d["a_"+it.id]||[]).push({v,d:new Date().toISOString().slice(0,10)});OP=it.id;save();render()};
   ab.append(mk("span",null,"Πραγματικά:"),ai,ad);(mo(M)["a_"+it.id]||[]).forEach((e,i)=>{const b=mk("button",null,eur(num(e.v))+" ✕");b.title=e.d||"";b.onclick=()=>{mo(M)["a_"+it.id].splice(i,1);OP=it.id;save();render()};ab.append(b)});s.append(ab)}
  const x=mk("button","del","🗑 Διαγραφή");x.onclick=()=>{x.classList.add("hide");const o=mk("div","sw");o.style.flexWrap="wrap";const hid=all=>{for(let m=M;m<=(all?11:M);m++){const d=data[m]=data[m]||{};d["x_"+it.id]=1;d[it.id]="";d["p_"+it.id]="";d["a_"+it.id]=[]}save();render()};const q1=mk("button",null,"Μόνο αυτό τον μήνα"),q2=mk("button",null,"Από εδώ και μετά"),q3=mk("button","del","Παντού (σβήνει το item)"),q4=mk("button",null,"Άκυρο");q1.onclick=()=>hid(false);q2.onclick=()=>hid(true);q3.onclick=()=>{cfg=cfg.filter(y=>y.id!==it.id);saveCfg();render()};q4.onclick=()=>{o.remove();x.classList.remove("hide")};o.append(q1,q2,q3,q4);s.append(o)};s.append(x);
  w.append(r,s);box.append(w)})}
function drag(e,w,box,t){
 e.preventDefault();w.classList.add("drg");
 const mv=ev=>{const el=document.elementFromPoint(box.getBoundingClientRect().left+30,ev.clientY),r=el&&el.closest(".item");
  if(r&&r!==w&&r.parentNode===box){const b=r.getBoundingClientRect();box.insertBefore(w,ev.clientY<b.top+b.height/2?r:r.nextSibling)}};
 const up=()=>{window.removeEventListener("pointermove",mv);w.classList.remove("drg");
  const ids=[...box.querySelectorAll(".item")].map(x=>x.dataset.id);
  const full=L(t),pos=[];full.forEach((x,i)=>{if(ids.includes(x.id))pos.push(i)});const its=ids.map(id=>cfg.find(x=>x.id===id));its.forEach((x,k)=>{full[pos[k]]=x});cfg=[...cfg.filter(x=>x.t!==t),...full];saveCfg()};
 window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up,{once:true});window.addEventListener("pointercancel",up,{once:true})}
function banner(){
 const b=$("bn");b.innerHTML="";
 if(Y!==now.getFullYear()||M!==now.getMonth()){b.classList.add("hide");return}
 const td=now.getDate(),late=[];
 LV("e",M).forEach(it=>{if(!it.d||mo(M)["p_"+it.id])return;const df=it.d-td;if(df<=3)late.push([df,it.n])});
 late.sort((a,c)=>a[0]-c[0]);
 b.classList.toggle("hide",!late.length);if(!late.length)return;
 b.append(mk("h2",null,"⏰ Να πληρώσεις"));
 late.forEach(([df,n])=>b.append(mk("div",df<0?"neg":null,n+" — "+(df<0?"ληξιπρόθεσμο ("+(-df)+" μέρες)":df===0?"σήμερα":"σε "+df+(df===1?" μέρα":" μέρες")))))}
function sums(){
 const a=tot(M,"i"),b=tot(M,"e"),c=a-b;$("si").textContent=eur(a);$("se").textContent=eur(b);
 const e=$("sb");e.textContent=eur(c);e.className=c<0?"neg":"pos";const ta=L("e").reduce((q,x)=>q+A(M,x.id),0);$("ac").textContent=ta?"Πραγματικά έξοδα: "+eur(ta)+" (προγραμματισμένα: "+eur(b)+")":""}
function year(){
 const D=MN.map((_,m)=>tot(m,"i")-tot(m,"e")),mx=Math.max(1,...D.map(Math.abs));
 $("ch").innerHTML=MN.map((n,m)=>`<div><i style="height:${Math.abs(D[m])/mx*100}%;background:${D[m]<0?"var(--bad)":"var(--ok)"}"></i>${n.slice(0,3)}</div>`).join("");
 let h="<tr><th>Μήνας</th><th>Έσοδα</th><th>Έξοδα</th><th>Υπόλοιπο</th></tr>",ti=0,te=0;
 MN.forEach((n,m)=>{const a=tot(m,"i"),b=tot(m,"e");ti+=a;te+=b;h+=`<tr><td>${n}</td><td>${eur(a)}</td><td>${eur(b)}</td><td class="${a-b<0?"neg":"pos"}">${eur(a-b)}</td></tr>`});
 h+=`<tr><th>Σύνολο</th><th>${eur(ti)}</th><th>${eur(te)}</th><th class="${ti-te<0?"neg":"pos"}">${eur(ti-te)}</th></tr>`;$("tb").innerHTML=h;
 const yl=$("yl");yl.innerHTML="";
 const list=L("e").map(it=>[it,MN.map((_,m)=>num(mo(m)[it.id]))]).map(([it,v])=>[it,v,v.reduce((a,b)=>a+b,0)]).filter(x=>x[2]>0||MN.some((_,m)=>A(m,x[0].id)>0)).sort((a,b)=>b[2]-a[2]);
 if(!list.length){yl.append(mk("span","st","Δεν υπάρχουν δεδομένα ακόμα"));return}
 list.forEach(([it,v,s])=>{const d=mk("div","yi"),t=mk("div","t");{const ac=MN.reduce((q,_,m)=>q+A(m,it.id),0);t.append(mk("span",null,it.n),mk("b",null,eur(s)+(ac?" · πραγμ. "+eur(ac):"")))}
  const g=mk("div","mg hide");v.forEach((x,m)=>{if(x>0){const c=mk("span");if(col(m,it.id))c.style.color=col(m,it.id);c.append(MN[m].slice(0,3)+": ",mk("b",null,eur(x)));g.append(c)}});
  d.onclick=()=>g.classList.toggle("hide");d.append(t,g);yl.append(d)})}

 [["i","Έσοδο"],["e","Έξοδο"]].forEach(([t,lb])=>L(t).forEach(it=>{const v=MN.map((_,m)=>num(mo(m)[it.id]));o.push([lb,it.n,...v,sm(v)])}));

 o.push(["","Πραγματικά έξοδα",...ax,sm(ax)]);o.push(["","Σύνολο εσόδων",...a,sm(a)],["","Σύνολο εξόδων",...b,sm(b)],["","Υπόλοιπο",...c,sm(c)]);return o}

{const g=ls("ghcfg",{});$("g1").value=g.repo||"";$("g2").value=g.branch||"";$("g3").value=g.path||"";$("g4").value=g.token||"";if(!g.repo)$("gp").classList.remove("hide")}
